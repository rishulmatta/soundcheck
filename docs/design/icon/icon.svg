<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211d1a"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cc9ea" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7cc9ea" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- the Qloo signal pulsing out from the untapped stop -->
    <circle cx="440" cy="690" r="230" fill="url(#glow)"/>
    <g fill="none" stroke="#7cc9ea">
      <circle cx="440" cy="690" r="170" stroke-width="14" stroke-opacity="0.32"/>
      <circle cx="440" cy="690" r="270" stroke-width="12" stroke-opacity="0.16"/>
      <circle cx="440" cy="690" r="370" stroke-width="10" stroke-opacity="0.07"/>
    </g>
  </g>
  <!-- the tour route, drawn as a check -->
  <polyline points="270,510 440,690 770,320" fill="none" stroke="#f2a93b" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stops -->
  <circle cx="270" cy="510" r="64" fill="#121110" stroke="#f2a93b" stroke-width="32"/>
  <circle cx="770" cy="320" r="66" fill="#f2a93b"/>
  <circle cx="440" cy="690" r="78" fill="#7cc9ea" stroke="#121110" stroke-width="24"/>
</svg>
