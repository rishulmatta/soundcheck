<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1500px;height:1000px;background:#121110;overflow:hidden}
body{position:relative;font-family:"IBM Plex Sans";color:#f4efe6}
.shot{position:absolute;right:-260px;top:150px;width:1000px;border-radius:18px;box-shadow:0 30px 80px #000c;border:1px solid #2a2622;transform:rotate(-3deg);opacity:.95}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#121110 42%,#121110d9 58%,#12111000 82%)}
.copy{position:absolute;left:110px;top:50%;transform:translateY(-50%);width:600px}
.icon{width:150px;height:150px;display:block;border-radius:33px;box-shadow:0 0 0 1px #3a342e,0 20px 50px #000a}
h1{font-family:"Barlow Condensed";font-size:140px;line-height:.9;margin:44px 0 0;letter-spacing:.5px}
p{font-size:32px;line-height:1.35;color:#a69e92;margin:28px 0 0}
p b{color:#f4efe6;font-weight:500}
.tag{margin-top:44px;font-family:"IBM Plex Mono";font-size:20px;letter-spacing:3px;color:#7cc9ea}
.tag span{border:2px solid #7cc9ea;padding:4px 10px;border-radius:6px;margin-left:12px}
</style></head><body>
<img class="shot" src="03-tour.png">
<div class="fade"></div>
<div class="copy">
  <img class="icon" src="../icon/icon-1024.png">
  <h1>SOUNDCHECK</h1>
  <p><b>Find your next tour markets.</b> An agent that routes a tour through the cities where an act's taste is primed.</p>
  <div class="tag">BUILT ON <span>QLOO</span></div>
</div>
</body></html>
